		<style>
	#mobile-controls {
	    position: fixed;
	    bottom: 20px;
	    left: 0;
	    width: 100%;
	    display: flex;
	    justify-content: space-between;
	    padding: 0 25px;
	    box-sizing: border-box;
	    pointer-events: none; /* Lets touches pass through empty areas to the game */
	    z-index: 9999;
	    user-select: none;
	    -webkit-user-select: none;
	}

	.control-group {
		display: flex;
		gap: 15px;
		pointer-events: auto;
	}

	.touch-btn {
		width: 65px;
	    height: 65px;
	    border-radius: 50%;
	    background: rgba(255, 255, 255, 0.25);
	    border: 2px solid rgba(255, 255, 255, 0.6);
	    color: white;
	    font-family: sans-serif;
	    font-size: 20px;
	    font-weight: bold;
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    touch-action: none; /* Prevents browser zooming/scrolling on tap */
	}

  	.touch-btn:active {
    	background: rgba(255, 255, 255, 0.5);
  	}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<body>
		<div id="mobile-controls">
  <!-- Left / Right Movement -->
  <div class="control-group">
    <div class="touch-btn" data-key="ArrowLeft" data-code="ArrowLeft">◀</div>
    <div class="touch-btn" data-key="ArrowRight" data-code="ArrowRight">▶</div>
  </div>

  <!-- Action / Jump Buttons -->
  <div class="control-group">
    <div class="touch-btn" data-key=" " data-code="Space">JUMP</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const buttons = document.querySelectorAll('.touch-btn');

  function triggerKey(type, key, code) {
    if (!canvas) return;
    canvas.focus(); // Ensure Godot canvas has focus to receive keys
    const event = new KeyboardEvent(type, {
      key: key,
      code: code,
      bubbles: true,
      cancelable: true
    });
    canvas.dispatchEvent(event);
  }

  buttons.forEach(btn => {
    const key = btn.getAttribute('data-key');
    const code = btn.getAttribute('data-code');

    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      triggerKey('keydown', key, code);
    }, { passive: false });

    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      triggerKey('keyup', key, code);
    }, { passive: false });

    btn.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      triggerKey('keyup', key, code);
    }, { passive: false });
  });
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":316536,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
